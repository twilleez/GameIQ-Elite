name: Apply cloud sync retry

on:
  push:
    branches: [agent/program-manager-phase1]
    paths:
      - 'scripts/patch-cloud-sync-retry.mjs'
      - 'src/services/cloud-sync.js'
      - 'tests/cloud-sync.test.js'
      - '.github/workflows/apply-cloud-sync-retry.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip retry patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-manager-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-cloud-sync-retry.mjs
      - run: npm test
      - name: Commit production patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'phase 3: wire bounded cloud sync retry [skip retry patch]'
          git push origin HEAD:agent/program-manager-phase1
