name: Apply cloud sync retry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-manager-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-cloud-sync-retry.mjs
      - run: npm test
      - name: Commit production patch if needed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'phase 3: wire bounded cloud sync retry'
          git push origin HEAD:agent/program-manager-phase1
