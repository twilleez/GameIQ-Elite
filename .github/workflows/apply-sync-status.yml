name: Apply sync status UX
on:
  push:
    branches: [agent/program-manager-phase1]
    paths: ['.github/workflows/apply-sync-status.yml']
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/program-manager-phase1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/patch-sync-status.mjs
      - run: npm test
      - run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'phase 4: show offline and syncing status'
          git push origin HEAD:agent/program-manager-phase1
