name: Fix Preview Storage

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-preview-storage.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch preview storage
        run: node scripts/patch-preview-storage.mjs
      - name: Verify preview isolation
        run: |
          grep -q 'gameiq_preview_v3' preview/index.html
          ! grep -q 'const SK="gameiq_v3"' preview/index.html
      - name: Commit preview fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html
          git commit -m "preview: isolate QA storage from production"
          git push
