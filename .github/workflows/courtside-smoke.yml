name: Courtside Smoke

on:
  pull_request:
    paths:
      - 'preview/**'
      - 'tests/courtside-smoke.mjs'
      - 'package.json'
      - '.github/workflows/courtside-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'preview/**'
      - 'tests/courtside-smoke.mjs'
      - 'package.json'
      - '.github/workflows/courtside-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  courtside:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gameiq-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8765/preview/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/gameiq-http.log
          exit 1
      - name: Run courtside smoke
        run: npm run test:courtside
