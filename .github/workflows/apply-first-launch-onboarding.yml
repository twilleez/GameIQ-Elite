name: Apply First Launch Onboarding
on:
  workflow_dispatch:
  push:
    branches: [agent/program-manager-phase1]
    paths: ['.github/workflows/apply-first-launch-onboarding.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Apply onboarding UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          # Correct stale dashboard instruction.
          s=s.replace('Pick Made / Miss / FT, then tap the court','Pick Made or Miss, then tap the court. For FT, choose Made FT or Miss FT')
          # Add welcome dialog before settings dialog.
          marker='<dialog id="dlgSettings">'
          welcome='''<dialog id="dlgWelcome" style="max-width:560px;width:calc(100% - 28px)">
  <div class="dlg-head"><div><b>Welcome to GameIQ Elite</b><div class="muted" style="font-size:12px">Track the game. Understand your players. Make better coaching decisions.</div></div></div>
  <div style="padding:18px;display:grid;gap:12px">
    <button class="btn btn-primary" id="welcomeSignInBtn">👤 Sign In</button>
    <button class="btn btn-gold" id="welcomeStartFreeBtn">🏀 Start Free</button>
    <button class="btn btn-secondary" id="welcomeDemoBtn">See how it works</button>
    <div class="muted" style="font-size:12px;text-align:center">Start Free requires no credit card. You can sign in later to sync across devices.</div>
  </div>
</dialog>
<dialog id="dlgFirstSetup" style="max-width:560px;width:calc(100% - 28px)">
  <div class="dlg-head"><div><b>Set up your team</b><div class="muted" id="firstSetupStepLabel" style="font-size:12px">Step 1 of 3</div></div></div>
  <div style="padding:18px">
    <div id="firstSetupStep1"><label class="muted">Team name</label><input id="firstTeamName" placeholder="e.g. Trailblazers" style="width:100%;margin:8px 0 14px"><button class="btn btn-primary" id="firstTeamNextBtn" style="width:100%">Continue</button></div>
    <div id="firstSetupStep2" class="hidden"><div style="font-weight:800;margin-bottom:6px">Add players</div><div class="muted" style="font-size:13px;margin-bottom:12px">Add your roster now, or skip and add players from Teams later.</div><button class="btn btn-primary" id="firstAddPlayersBtn" style="width:100%;margin-bottom:8px">Add players</button><button class="btn btn-secondary" id="firstSkipPlayersBtn" style="width:100%">Skip for now</button></div>
    <div id="firstSetupStep3" class="hidden"><div style="font-weight:800;margin-bottom:6px">You're ready</div><div class="muted" style="font-size:13px;margin-bottom:12px">Your team is set up. Start your first game when you're ready.</div><button class="btn btn-gold" id="firstStartGameBtn" style="width:100%">Start first game</button></div>
  </div>
</dialog>
'''
          assert marker in s; s=s.replace(marker,welcome+marker,1)
          # Add first-launch helpers before openSettings.
          marker2='function openSettings(){'
          helpers='''const FIRST_LAUNCH_KEY="gameiq_first_launch_v1";
function finishFirstLaunch(){localStorage.setItem(FIRST_LAUNCH_KEY,"1");}
function showWelcomeIfNeeded(){if(!localStorage.getItem(FIRST_LAUNCH_KEY)&&!authUser)setTimeout(()=>$("dlgWelcome")?.showModal(),180);}
function openFirstSetup(){$("dlgWelcome")?.close();$("firstSetupStep1")?.classList.remove("hidden");$("firstSetupStep2")?.classList.add("hidden");$("firstSetupStep3")?.classList.add("hidden");if($("firstSetupStepLabel"))$("firstSetupStepLabel").textContent="Step 1 of 3";$("dlgFirstSetup")?.showModal();}
function firstSetupStep(n){for(let i=1;i<=3;i++)$("firstSetupStep"+i)?.classList.toggle("hidden",i!==n);if($("firstSetupStepLabel"))$("firstSetupStepLabel").textContent=`Step ${n} of 3`;}
'''
          assert marker2 in s; s=s.replace(marker2,helpers+marker2,1)
          # Bind controls near account bindings.
          marker3='''  const accountBtn=$("accountBtn");'''
          bindings='''  const welcomeSignInBtn=$("welcomeSignInBtn");
  if(welcomeSignInBtn)welcomeSignInBtn.addEventListener("click",()=>{$("dlgWelcome")?.close();openSettings();setTimeout(()=>$("acctEmailInput")?.focus(),50)});
  const welcomeStartFreeBtn=$("welcomeStartFreeBtn");
  if(welcomeStartFreeBtn)welcomeStartFreeBtn.addEventListener("click",openFirstSetup);
  const welcomeDemoBtn=$("welcomeDemoBtn");
  if(welcomeDemoBtn)welcomeDemoBtn.addEventListener("click",()=>{$("dlgWelcome")?.close();finishFirstLaunch();toast("Demo mode: explore GameIQ with the current sample workspace","ok")});
  const firstTeamNextBtn=$("firstTeamNextBtn");
  if(firstTeamNextBtn)firstTeamNextBtn.addEventListener("click",()=>{const name=$("firstTeamName")?.value?.trim();if(!name){toast("Enter a team name","err");return;}const t=activeTeam();if(t)t.name=name;persist();renderAll();firstSetupStep(2)});
  const firstAddPlayersBtn=$("firstAddPlayersBtn");
  if(firstAddPlayersBtn)firstAddPlayersBtn.addEventListener("click",()=>{firstSetupStep(3);$("dlgFirstSetup")?.close();finishFirstLaunch();switchView("teams");toast("Add players, then start your first game","ok")});
  const firstSkipPlayersBtn=$("firstSkipPlayersBtn");
  if(firstSkipPlayersBtn)firstSkipPlayersBtn.addEventListener("click",()=>firstSetupStep(3));
  const firstStartGameBtn=$("firstStartGameBtn");
  if(firstStartGameBtn)firstStartGameBtn.addEventListener("click",()=>{$("dlgFirstSetup")?.close();finishFirstLaunch();switchView("game");toast("Ready for your first game","ok")});
'''
          assert marker3 in s; s=s.replace(marker3,bindings+marker3,1)
          # Trigger after initial render/account init; append safe DOM ready fallback.
          s=s.replace('</script>','''\nwindow.addEventListener("load",showWelcomeIfNeeded,{once:true});\n</script>''',1)
          p.write_text(s)
          PY
      - name: Verify and test
        run: |
          grep -q 'id="dlgWelcome"' index.html
          grep -q 'id="dlgFirstSetup"' index.html
          grep -q 'Start Free' index.html
          grep -q 'Made FT or Miss FT' index.html
          npm test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'feat: add first-launch welcome and team setup'
          git push
