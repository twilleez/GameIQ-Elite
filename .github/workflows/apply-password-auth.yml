name: Apply Password Auth
on:
  workflow_dispatch:
  push:
    branches: [agent/program-manager-phase1]
    paths: ['.github/workflows/apply-password-auth.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Switch Magic Link auth to email/password
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''      <div id="acctSignedOut">\n        <div class="api-key-wrap"><input type="email" id="acctEmailInput" placeholder="you@example.com" autocomplete="email"/><button class="btn btn-primary" id="acctSendLinkBtn" style="white-space:nowrap">Send Link</button></div>\n        <p class="api-key-note">Sign in to manage Pro billing and use the hosted AI Coach (no API key needed). We'll email you a one-time sign-in link — no password.</p>'''
          new='''      <div id="acctSignedOut">\n        <div style="display:grid;gap:8px">\n          <input type="email" id="acctEmailInput" placeholder="Email" autocomplete="email"/>\n          <input type="password" id="acctPasswordInput" placeholder="Password" autocomplete="current-password" minlength="8"/>\n          <div style="display:flex;gap:8px;flex-wrap:wrap">\n            <button class="btn btn-primary" id="acctSignInBtn" style="flex:1;min-width:120px">Sign In</button>\n            <button class="btn btn-secondary" id="acctCreateBtn" style="flex:1;min-width:140px">Create Account</button>\n          </div>\n        </div>\n        <p class="api-key-note">Sign in with your saved email and password. Routine sign-in does not send an email link. Passwords are handled by Supabase Auth and are not stored in GameIQ local storage.</p>'''
          assert old in s, 'signed-out account block not found'
          s=s.replace(old,new,1)

          start=s.index('async function sendMagicLink(){')
          end=s.index('async function signOut(){', start)
          replacement='''async function signInWithPassword(){\n  if(!authEnabled()){toast("Account sign-in isn't configured yet","err");return false}\n  const email=($("acctEmailInput")?.value||"").trim();\n  const password=$("acctPasswordInput")?.value||"";\n  if(!email){toast("Enter your email","err");return false}\n  if(!password){toast("Enter your password","err");return false}\n  const btn=$("acctSignInBtn");if(btn)btn.disabled=true;\n  const {data,error}=await sb.auth.signInWithPassword({email,password});\n  if(btn)btn.disabled=false;\n  if(error){toast("Sign in failed: "+error.message,"err");return false}\n  authUser=data?.user?{id:data.user.id,email:data.user.email}:null;\n  await refreshAccountTier();\n  renderAccountUI();\n  retryPendingCloudSync().then(()=>pullCloudGamesToDevice());\n  toast("Signed in","ok");\n  return true;\n}\nasync function createPasswordAccount(){\n  if(!authEnabled()){toast("Account sign-up isn't configured yet","err");return false}\n  const email=($("acctEmailInput")?.value||"").trim();\n  const password=$("acctPasswordInput")?.value||"";\n  if(!email){toast("Enter your email","err");return false}\n  if(password.length<8){toast("Use a password with at least 8 characters","err");return false}\n  const btn=$("acctCreateBtn");if(btn)btn.disabled=true;\n  const {data,error}=await sb.auth.signUp({email,password});\n  if(btn)btn.disabled=false;\n  if(error){toast("Couldn't create account: "+error.message,"err");return false}\n  if(data?.session&&data?.user){\n    authUser={id:data.user.id,email:data.user.email};\n    await refreshAccountTier();renderAccountUI();\n    toast("Account created and signed in","ok");\n  }else{\n    toast("Account created. Check your email only if confirmation is required.","ok");\n  }\n  return true;\n}\n'''
          s=s[:start]+replacement+s[end:]

          old_bind='''  const acctSendLinkBtn=$("acctSendLinkBtn");\n  if(acctSendLinkBtn)acctSendLinkBtn.addEventListener("click",sendMagicLink);'''
          new_bind='''  const acctSignInBtn=$("acctSignInBtn");\n  if(acctSignInBtn)acctSignInBtn.addEventListener("click",signInWithPassword);\n  const acctCreateBtn=$("acctCreateBtn");\n  if(acctCreateBtn)acctCreateBtn.addEventListener("click",createPasswordAccount);\n  const acctPasswordInput=$("acctPasswordInput");\n  if(acctPasswordInput)acctPasswordInput.addEventListener("keydown",e=>{if(e.key==="Enter")signInWithPassword()});'''
          assert old_bind in s, 'account binding block not found'
          s=s.replace(old_bind,new_bind,1)
          p.write_text(s)
          PY
      - name: Verify and test
        run: |
          grep -q 'id="acctPasswordInput"' index.html
          grep -q 'signInWithPassword' index.html
          grep -q 'id="acctCreateBtn"' index.html
          if grep -q 'signInWithOtp' index.html; then echo 'Magic-link sign in still present' && exit 1; fi
          npm test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'feat: authenticate with email and password'
          git push
