name: Apply Missed FT
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-manager-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/add-missed-ft.mjs
      - name: Verify FT behavior wiring
        run: |
          grep -q '"ftmiss","Missed FT"' index.html
          grep -q 'if(stat==="ftm")' index.html
          grep -q 'stat==="ftmiss"' index.html
          npm test
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add made and missed free throw tracking"
          git push origin HEAD:agent/program-manager-phase1
